<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medex East Africa â€” Cash & Operations Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --black:     #080a0d;
  --black-2:   #0f1419;
  --black-3:   #111820;
  --panel:     #111925;
  --border:    rgba(255,255,255,0.07);
  --border-bright: rgba(255,255,255,0.14);
  --amber:     #f0a500;
  --amber-dim: rgba(240,165,0,0.15);
  --amber-glow:rgba(240,165,0,0.06);
  --red:       #e03434;
  --red-dim:   rgba(224,52,52,0.12);
  --blue:      #4a80c4;
  --blue-dim:  rgba(74,128,196,0.12);
  --green:     #2ecc71;
  --white:     #eef0f4;
  --white-60:  rgba(238,240,244,0.78);
  --white-30:  rgba(238,240,244,0.52);
  --white-10:  rgba(238,240,244,0.08);
  --display:   'Bebas Neue', sans-serif;
  --heading:   'Syne', sans-serif;
  --mono:      'DM Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--heading);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* grain */
body::after{content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");opacity:0.45}

/* grid lines */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(240,165,0,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(240,165,0,0.025) 1px,transparent 1px);background-size:80px 80px}

.wrapper{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 32px 80px}

/* â”€â”€ TOPBAR â”€â”€ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0 18px;border-bottom:1px solid var(--border);margin-bottom:32px;gap:16px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo-mark{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--amber);display:flex;align-items:center;gap:8px}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.brand{font-family:var(--display);font-size:22px;letter-spacing:0.04em;color:var(--white);line-height:1}
.brand .amber{color:var(--amber)}
.topbar-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.meta-pill{font-family:var(--mono);font-size:10px;color:var(--white-30);display:flex;align-items:center;gap:6px;letter-spacing:0.06em}
.meta-pill .live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite}
.meta-pill strong{color:var(--white-60)}
.nav-link{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:rgba(240,165,0,0.7);text-decoration:none;border:1px solid rgba(240,165,0,0.25);padding:4px 10px;transition:color 0.2s}
.nav-link:hover{color:var(--amber)}

/* â”€â”€ PROOF STRIP â”€â”€ */
.proof-strip{display:flex;align-items:center;flex-wrap:wrap;gap:20px;background:var(--amber-glow);border:1px solid rgba(240,165,0,0.12);padding:10px 20px;margin-bottom:40px}
.proof-item{font-family:var(--mono);font-size:10px;color:var(--white-30);display:flex;align-items:center;gap:7px;letter-spacing:0.04em}
.proof-item .pip{width:4px;height:4px;border-radius:50%;background:var(--amber);flex-shrink:0}

/* â”€â”€ SECTION HEADERS â”€â”€ */
.section-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.section-header h2{font-family:var(--display);font-size:32px;color:var(--white);letter-spacing:0.03em;line-height:1}
.section-tag{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:0.16em;text-transform:uppercase;border:1px solid rgba(240,165,0,0.25);padding:3px 9px}

/* â”€â”€ KPI GRID â”€â”€ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:40px}
.kpi-card{background:var(--black-2);padding:20px 22px;position:relative;overflow:hidden;opacity:0;transform:translateY(16px);animation:card-in 0.5s ease forwards;transition:background 0.2s}
.kpi-card:hover{background:var(--black-3)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:0.5}
@keyframes card-in{to{opacity:1;transform:translateY(0)}}
.kpi-card:nth-child(1){animation-delay:.05s}.kpi-card:nth-child(2){animation-delay:.10s}.kpi-card:nth-child(3){animation-delay:.15s}.kpi-card:nth-child(4){animation-delay:.20s}.kpi-card:nth-child(5){animation-delay:.25s}.kpi-card:nth-child(6){animation-delay:.30s}.kpi-card:nth-child(7){animation-delay:.35s}.kpi-card:nth-child(8){animation-delay:.40s}
.kpi-label{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px}
.kpi-value{font-family:var(--mono);font-size:24px;font-weight:500;color:var(--white);letter-spacing:-0.5px;line-height:1}
.kpi-value.danger{color:var(--red)}.kpi-value.amber{color:var(--amber)}.kpi-value.green{color:var(--green)}.kpi-value.blue{color:var(--blue)}
.kpi-sub{font-family:var(--mono);font-size:9px;color:var(--white-30);margin-top:6px;letter-spacing:0.04em}
.kpi-help{position:absolute;top:12px;right:12px;width:18px;height:18px;border:1px solid rgba(240,165,0,0.35);background:rgba(240,165,0,0.08);color:var(--amber);font-family:var(--mono);font-size:10px;line-height:16px;text-align:center;cursor:pointer}
.kpi-help-popover{display:none;position:absolute;top:36px;right:12px;width:min(280px,calc(100% - 24px));z-index:5;background:#0b1117;border:1px solid rgba(240,165,0,0.35);padding:12px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--white-60);box-shadow:0 16px 40px rgba(0,0,0,0.35)}
.kpi-card.help-open{overflow:visible}
.kpi-card.help-open .kpi-help-popover{display:block}

/* â”€â”€ CASH SIGNAL CARD â”€â”€ */
.risk-badge-card{grid-column:span 2;display:flex;align-items:center;gap:20px;background:var(--black-2);padding:20px 24px}
.risk-badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:8px 18px;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.risk-badge.DANGER{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,52,52,0.3);animation:pulse-red 1.6s ease-in-out infinite}
.risk-badge.WATCH{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,165,0,0.3)}
.risk-badge.PRESSURE{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,165,0,0.3)}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(224,52,52,0.3)}50%{box-shadow:0 0 0 8px transparent}}
.risk-badge-info{flex:1}
.risk-badge-title{font-family:var(--display);font-size:18px;color:var(--white);margin-bottom:4px;letter-spacing:0.03em}
.risk-badge-desc{font-family:var(--mono);font-size:10px;color:var(--white-30);letter-spacing:0.04em}

/* â”€â”€ AGING â”€â”€ */
.aging-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.aging-card{background:var(--black-2);padding:18px 20px;opacity:0;transform:translateY(12px);animation:card-in 0.5s ease forwards;transition:background 0.2s}
.aging-card:hover{background:var(--black-3)}
.aging-card:nth-child(1){animation-delay:.50s}.aging-card:nth-child(2){animation-delay:.55s}.aging-card:nth-child(3){animation-delay:.60s}.aging-card:nth-child(4){animation-delay:.65s}.aging-card:nth-child(5){animation-delay:.70s}.aging-card:nth-child(6){animation-delay:.75s}
.aging-band{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.aging-amount{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--white);margin-bottom:10px}
.aging-bar-track{background:rgba(255,255,255,0.05);height:3px;overflow:hidden}
.aging-bar-fill{height:100%;width:0;transition:width 1.4s cubic-bezier(0.4,0,0.2,1)}
.aging-bar-fill.safe{background:var(--green)}.aging-bar-fill.caution{background:var(--amber)}.aging-bar-fill.risk{background:var(--red)}

/* â”€â”€ EXEC SIGNAL â”€â”€ */
.exec-signal{background:var(--black-2);border:1px solid var(--border);padding:28px;margin-bottom:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;opacity:0;transform:translateY(12px);animation:card-in 0.5s ease forwards 1.0s}
.exec-signal-item{border-left:2px solid var(--border);padding-left:20px}
.exec-signal-item:first-child{border-left-color:var(--red)}.exec-signal-item:nth-child(2){border-left-color:var(--amber)}.exec-signal-item:nth-child(3){border-left-color:var(--blue)}
.exec-label{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px}
.exec-text{font-family:var(--heading);font-size:13px;color:var(--white-60);line-height:1.6}

/* â”€â”€ TWO-COL â”€â”€ */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:40px}
.panel{background:var(--black-2);padding:24px;opacity:0;transform:translateY(12px);animation:card-in 0.5s ease forwards}
.panel:nth-child(1){animation-delay:.8s}.panel:nth-child(2){animation-delay:.9s}
.panel h3{font-family:var(--display);font-size:22px;color:var(--white);margin-bottom:18px;letter-spacing:0.03em}

/* â”€â”€ TABLES â”€â”€ */
.rie-table{width:100%;border-collapse:collapse}
.rie-table th{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.12em;text-transform:uppercase;padding:0 10px 10px;text-align:left;border-bottom:1px solid var(--border);font-weight:600}
.rie-table td{font-family:var(--mono);font-size:11px;color:var(--white-60);padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
.rie-table tr:last-child td{border-bottom:none}
.rie-table tr:hover td{background:var(--amber-glow)}
.td-danger{color:var(--red)!important}.td-amber{color:var(--amber)!important}.td-green{color:var(--green)!important}

/* â”€â”€ TAGS â”€â”€ */
.tag{font-family:var(--mono);font-size:8px;font-weight:500;padding:3px 7px;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;display:inline-block}
.tag.legal{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,52,52,0.25)}
.tag.urgent{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,165,0,0.25)}
.tag.mgmt{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(74,128,196,0.25)}
.tag.normal{background:var(--white-10);color:var(--white-30);border:1px solid rgba(255,255,255,0.08)}
.tag.high{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,52,52,0.25)}
.tag.watch{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,165,0,0.25)}
.tag.ok{background:rgba(46,204,113,0.08);color:var(--green);border:1px solid rgba(46,204,113,0.2)}
.rank-num{width:22px;height:22px;background:var(--black-3);border:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--white-30);display:inline-flex;align-items:center;justify-content:center}

/* â”€â”€ FULL SECTION â”€â”€ */
.full-section{background:var(--black-2);border:1px solid var(--border);padding:24px;margin-bottom:40px;opacity:0;transform:translateY(12px);animation:card-in 0.5s ease forwards}
.full-section h3{font-family:var(--display);font-size:22px;color:var(--white);margin-bottom:18px;letter-spacing:0.03em}

/* â”€â”€ SETTINGS â”€â”€ */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.setting-item{background:var(--black-3);padding:14px 16px;transition:background 0.2s}
.setting-item:hover{background:var(--panel)}
.setting-key{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.setting-val{font-family:var(--mono);font-size:18px;color:var(--amber)}

/* â”€â”€ OPERATIONAL CONTROL TOWER â”€â”€ */
.ops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:24px}
.ops-card{background:var(--black-2);padding:20px 22px;min-height:136px}
.ops-card h3{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin-bottom:14px}
.ops-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--white-30)}
.ops-row:last-child{border-bottom:0}.ops-row strong{font-size:12px;color:var(--white);font-weight:500;text-align:right}
.ops-row strong.risk{color:var(--red)}.ops-row strong.watch{color:var(--amber)}.ops-row strong.good{color:var(--green)}
.ops-note{font-family:var(--mono);font-size:10px;color:var(--white-30);margin:-10px 0 24px}

/* â”€â”€ DIVIDER â”€â”€ */
.section-divider{border:none;border-top:1px solid var(--border);margin:48px 0;position:relative}
.section-divider::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60px;height:1px;background:var(--amber);opacity:0.4}

/* â”€â”€ CASHFLOW SECTION â”€â”€ */
/* Inherits RIE design system exactly â€” same variables, same card style */
.cf-position-card{background:var(--black-2);border:1px solid var(--border);padding:28px;margin-bottom:32px;display:grid;grid-template-columns:auto 1fr auto auto;gap:24px;align-items:start}
.cf-status-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;min-width:100px;border-radius:2px}
.badge-active{background:var(--amber-dim);border:1px solid rgba(240,165,0,0.3)}
.badge-label{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--white-30);margin-bottom:4px}
.badge-val{font-family:var(--display);font-size:20px;color:var(--amber);letter-spacing:0.05em}
.cf-meta{display:flex;flex-direction:column;gap:8px}
.cf-meta-row{display:flex;align-items:flex-start;gap:12px;font-size:12px}
.cf-meta-key{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--white-30);min-width:56px;padding-top:2px}
.cf-meta-val{color:var(--white-60);font-family:var(--heading)}.cf-meta-val.amber{color:var(--amber)}.cf-meta-val.green{color:var(--green)}
.cf-headline h3{font-family:var(--heading);font-size:16px;font-weight:700;color:var(--white);line-height:1.4;margin-bottom:6px}
.cf-headline p{font-family:var(--heading);font-size:11px;color:var(--white-30);font-style:italic}
.cf-outlook{text-align:right;min-width:180px}
.cf-outlook-level{font-family:var(--display);font-size:28px;color:var(--white);letter-spacing:0.04em;margin-bottom:6px}
.cf-outlook-badge{display:inline-block;padding:3px 10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px}
.ob-watch{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(240,165,0,0.3)}
.cf-outlook-meta{font-family:var(--mono);font-size:10px;color:var(--white-30);line-height:2}
.cf-outlook-meta span{color:var(--white-60)}

/* â”€â”€ SIGNALS STRIP â”€â”€ */
.signals-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:40px}
.signal-card{background:var(--black-2);padding:20px 22px}
.signal-title{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:16px}
.signal-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sm-label{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--white-30);margin-bottom:4px}
.sm-val{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--white);line-height:1.2}
.sm-val.danger{color:var(--red)}.sm-val.amber{color:var(--amber)}.sm-val.green{color:var(--green)}.sm-val.blue{color:var(--blue)}

/* â”€â”€ CHART PANEL â”€â”€ */
.chart-panel{background:var(--black-2);border:1px solid var(--border);padding:24px;margin-bottom:24px}
.chart-panel h3{font-family:var(--mono);font-size:9px;color:var(--white);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px}
.chart-sub{font-family:var(--mono);font-size:10px;color:var(--white);margin-bottom:18px;font-style:italic}
.charts-equal{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:24px}
.inflow-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.inflow-row:last-child{border-bottom:none}
.inflow-label{font-family:var(--mono);font-size:11px;color:var(--white-60);flex:1}
.inflow-track{flex:1.5;background:rgba(255,255,255,0.05);height:5px;overflow:hidden}
.inflow-fill{height:100%}
.inflow-amt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--green);min-width:80px;text-align:right}

/* â”€â”€ CF TABLE â”€â”€ */
.cf-table-wrap{background:var(--black-2);border:1px solid var(--border);margin-bottom:32px}
.cf-table-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.cf-table-hdr-title{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.12em;text-transform:uppercase}
.cf-table-hint{font-family:var(--mono);font-size:10px;color:var(--white-30)}
.cf-table{width:100%;border-collapse:collapse}
.cf-table th{font-family:var(--mono);font-size:9px;color:var(--white-30);letter-spacing:0.1em;text-transform:uppercase;padding:10px 14px;text-align:right;border-bottom:1px solid var(--border);font-weight:600}
.cf-table th:first-child{text-align:left}
.cf-table td{padding:9px 14px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.04);font-family:var(--mono);font-size:11px;color:var(--white-60)}
.cf-table td:first-child{text-align:left;font-family:var(--mono);font-size:11px;color:var(--white-60)}
.cf-table tr:last-child td{border-bottom:none}
.cf-table tr:hover td{background:var(--amber-glow)}
.peak-row td{background:rgba(224,52,52,0.06)!important;border-top:1px solid rgba(224,52,52,0.2);border-bottom:1px solid rgba(224,52,52,0.2)}
.recovery-row td{background:rgba(46,204,113,0.05)!important;border-top:1px solid rgba(46,204,113,0.15);border-bottom:1px solid rgba(46,204,113,0.15)}
.peak-label{font-size:8px;color:var(--red);font-weight:700;letter-spacing:0.08em;margin-left:8px;text-transform:uppercase}
.rec-label{font-size:8px;color:var(--green);font-weight:700;letter-spacing:0.08em;margin-left:8px;text-transform:uppercase}
.neg{color:var(--red)!important}.pos{color:var(--green)!important}

/* â”€â”€ METRICS STRIP â”€â”€ */
.metrics-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:32px}
.metric-tile{background:var(--black-2);padding:18px 20px}

const fmt = n => n===0?'â€”':Math.abs(n)>=1e6?(n<0?'('+( Math.abs(n)/1e6).toFixed(2)+'M)':( n/1e6).toFixed(2)+'M'):(n<0?'('+ n.toLocaleString().replace('-','')+')':(n>0?n.toLocaleString():'â€”'));

function buildCFTable(infl, outfl, nets, cums, peakI, recI) {
  const tbody = document.getElementById('cf-tbody');
  tbody.innerHTML = '';
  weeks.forEach((wk,i)=>{
    const ef = nets[i]<0&&i<=peakI?Math.abs(nets[i]):0;
    const isPeak = i===peakI;
    const isRec = i===recI&&recI>=0;
    const tr = document.createElement('tr');
    if(isPeak) tr.className='peak-row';
    if(isRec) tr.className='recovery-row';
    const peakLbl = isPeak?'<span class="peak-label">â—„ PEAK GAP</span>':'';
    const recLbl  = isRec?'<span class="rec-label">â–² RECOVERY</span>':'';
    const gap = cums[i]<0?cums[i]:0;
    tr.innerHTML=`<td style="font-family:var(--mono)">${wk}${peakLbl}${recLbl}</td>
      <td class="pos">${infl[i].toLocaleString()}</td>
      <td class="neg">(${outfl[i].toLocaleString()})</td>
      <td class="${nets[i]<0?'neg':'pos'}">${fmt(nets[i])}</td>
      <td>${ef>0?ef.toLocaleString():'â€”'}</td>
      <td class="${cums[i]<0?'neg':'pos'}">${cums[i].toLocaleString()}</td>
      <td class="${gap<0?'neg':''}">${gap<0?'('+Math.abs(gap).toLocaleString()+')':(isPeak?'('+Math.abs(Math.min(...cums)).toLocaleString()+')':'â€”')}</td>`;
    tbody.appendChild(tr);
  });
}

const sheetsUrl = (id, range) =>
  `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?key=${API_KEY}`;

async function getRange(sheetId, range) {
  try {
    const r = await fetch(sheetsUrl(sheetId, range));
    if (!r.ok) return [];
    const j = await r.json();
    return j.values || [];
  } catch { return []; }
}

const parseN = v => { if(!v && v!==0) return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const parseRate = v => {
  const n = parseN(v);
  return String(v).includes('%') || n > 1 ? n / 100 : n;
};
const fmtKES = n => { const a=Math.abs(n); if(a>=1e9) return 'KES '+(n/1e9).toFixed(2)+'B'; if(a>=1e6) return 'KES '+(n/1e6).toFixed(2)+'M'; if(a>=1e3) return 'KES '+(n/1e3).toFixed(1)+'K'; return 'KES '+n.toLocaleString(); };
const fmtKSh = n => { const a=Math.abs(n); if(a>=1e6) return (n<0?'(KSh '+(a/1e6).toFixed(1)+'M)':'KSh '+(a/1e6).toFixed(1)+'M'); if(a>=1e3) return 'KSh '+(n/1e3).toFixed(0)+'K'; return 'KSh '+n.toLocaleString(); };

function setText(id, val) { const el=document.getElementById(id); if(el) el.textContent=val; }

async function fetchLiveCF() {
  const [assump, cfSheet, ctSheet, collSheet, dashSheet, rieSys] = await Promise.all([
    getRange(CF_SHEET, 'Project_Assumptions!A1:C35'),
    getRange(CF_SHEET, 'Monthly_Cashflow!A1:E20'),
    getRange(CF_SHEET, 'Cost_Tracker!A1:H15'),
    getRange(CF_SHEET, 'Collections_Tracker!A1:F8'),
    getRange(CF_SHEET, 'Dashboard!A1:B20'),
    getRange(RIE_SHEET, 'System_Metrics!A1:B30'),
  ]);

  if (!assump.length) return;

  // Parse assumptions
  const aval = kw => { const r=assump.find(row=>row.some(c=>c&&c.toString().includes(kw))); if(!r) return null; const i=r.findIndex(c=>c&&c.toString().includes(kw)); for(let j=i+1;j<r.length;j++){if(r[j]!==undefined&&r[j]!=='')return r[j];} return null; };

  const monthlyRev   = parseN(aval('Monthly Sales Revenue') || aval('Monthly Revenue'));
  const assumptionCollRate = parseRate(aval('Collection Rate'));
  const cogs         = parseRate(aval('COGS %')) || 0.58;
  const opex         = parseN(aval('Monthly Operating')) || 1200000;
  const equity       = parseN(aval('Equity'));
  const wcFacility   = parseN(aval('Working Capital Facility') || aval('WC facility'));
  const peakGap      = parseN(aval('Peak Working Capital Gap') || aval('Peak Gap')) || -3200000;
  const headroom     = wcFacility - Math.abs(peakGap);
  const grossMargin  = 1 - cogs;
  const monthlyGross = monthlyRev * grossMargin;
  const monthlyNet   = monthlyGross - opex;
  let collectionRate = assumptionCollRate;
  let collectionForecast = 0;
  let collectionActual = 0;
  const dashMetric = Object.fromEntries(
    dashSheet
      .filter(r=>r[0]!==undefined&&r[1]!==undefined)
      .map(r=>[String(r[0]).trim(), r[1]])
  );
  const rieMetric = Object.fromEntries(
    rieSys
      .filter(r=>r[0]!==undefined&&r[1]!==undefined)
      .map(r=>[String(r[0]).trim(), r[1]])
  );
  const overdueExposure = parseRate(rieMetric['Overdue %']);

  // Collection rate from actual cashflow collection performance
  if (collSheet.length > 1) {
    const hdrI = collSheet.findIndex(r=>r.some(c=>c&&String(c).includes('Forecast Collections')));
    if (hdrI >= 0) {
      const headers = collSheet[hdrI];
      const forecastI = headers.findIndex(c=>c&&String(c).includes('Forecast'));
      const actualI = headers.findIndex(c=>c&&String(c).includes('Actual'));
      const rows = collSheet.slice(hdrI+1).filter(r=>r[0]);
      collectionForecast = rows.reduce((s,r)=>s+parseN(r[forecastI]),0);
      collectionActual = rows.reduce((s,r)=>s+parseN(r[actualI]),0);
      if (collectionForecast > 0) collectionRate = collectionActual / collectionForecast;
    }
  }
  if (!collectionRate && dashMetric['COLLECTION RATE (YTD)']) collectionRate = parseRate(dashMetric['COLLECTION RATE (YTD)']);

  if (monthlyRev > 0) {
    setText('cf-kpi-rev',      fmtKSh(monthlyRev));
    setText('cf-kpi-cogs',     fmtKSh(monthlyRev * cogs));
    setText('cf-kpi-margin',   (grossMargin*100).toFixed(1)+'%');
    setText('cf-kpi-headroom', fmtKSh(headroom));
    setText('cf-kpi-collrate', (collectionRate*100||72).toFixed(1)+'%');
    setText('cf-banner-collections', (collectionRate*100||72).toFixed(1)+'%');
    if (overdueExposure) setText('cf-banner-overdue', (overdueExposure*100).toFixed(1)+'%');
  }
  if (wcFacility > 0) {
    setText('cf-sig-facility', fmtKSh(wcFacility));
    setText('cf-sig-headroom', fmtKSh(headroom));
    setText('cf-sig-peak',     fmtKSh(Math.abs(peakGap)));
    setText('cf-banner-headline', `${fmtKSh(Math.abs(peakGap))} timing gap created by delayed collections; ${fmtKSh(wcFacility)} facility leaves ${fmtKSh(headroom)} liquidity headroom.`);
  }

  // Cashflow management brief from Dashboard tab
  if (dashSheet.length > 1) {
    if (dashMetric['TOP RISK DRIVER']) setText('cf-exec-risk', dashMetric['TOP RISK DRIVER']);
    if (dashMetric['RECOMMENDED ACTION']) setText('cf-exec-action', dashMetric['RECOMMENDED ACTION']);
    if (dashMetric['MANAGEMENT PRIORITY']) setText('cf-exec-prio', dashMetric['MANAGEMENT PRIORITY']);
    if (dashMetric['CASHFLOW STATUS']) setText('cf-banner-status', String(dashMetric['CASHFLOW STATUS']).split(/[â€”-]/)[0].trim());
    if (dashMetric['TOP RISK DRIVER']) setText('cf-banner-risk', dashMetric['TOP RISK DRIVER']);
    if (dashMetric['RECOMMENDED ACTION']) setText('cf-banner-action', dashMetric['RECOMMENDED ACTION']);
    if (dashMetric['MANAGEMENT PRIORITY']) setText('cf-banner-priority', dashMetric['MANAGEMENT PRIORITY']);
  }

  // Collections signal from tracker
  if (collectionForecast > 0) {
      const shortfall= collectionActual-collectionForecast;
      setText('cf-sig-forecast',  fmtKSh(collectionForecast));
      setText('cf-sig-actual',    fmtKSh(collectionActual));
      setText('cf-sig-shortfall', shortfall<0?'('+fmtKSh(Math.abs(shortfall))+')':fmtKSh(shortfall));
      setText('cf-sig-rate',      (collectionRate*100).toFixed(1)+'%');
  }

  // Cost tracker totals
  if (ctSheet.length > 1) {
    const hdrI = ctSheet.findIndex(r=>r.some(c=>c&&c.includes('Category')));
    if (hdrI >= 0) {
      const rows = ctSheet.slice(hdrI+1).filter(r=>r[1]&&!r[1].includes('TOTAL'));
      const totBud = rows.reduce((s,r)=>s+parseN(r[2]),0);
      const totCom = rows.reduce((s,r)=>s+parseN(r[3]),0);
      const totAct = rows.reduce((s,r)=>s+parseN(r[4]),0);
      if (totBud > 0) {
        setText('ct-budget',    fmtKSh(totBud));
        setText('ct-committed', fmtKSh(totCom));
        setText('ct-actual',    fmtKSh(totAct));
        setText('ct-util',      ((totAct/totBud)*100).toFixed(1)+'%');
        setText('ct-remaining', fmtKSh(totBud-totAct));
      }
    }
  }
}

function summaryMap(rows, labelCol, valueCol) {
  const out = {};
  rows.forEach(r => {
    if (r[labelCol] !== undefined && r[valueCol] !== undefined) out[String(r[labelCol]).trim()] = r[valueCol];
  });
  return out;
}

    setText('ops-actions-blocked', String(parseN(m['Blocked'])));
    setText('ops-actions-oldest', parseN(m['Oldest open, days'])+' days');

        const status = r[5] || 'Open';

      }).join('');
    }
  }
}
